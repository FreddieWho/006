manifest_version: "v6.1"
project_title: "PD-1-centered TME mechanism nomination framework"
run_metadata:
  owner: "<agent_or_operator>"
  run_date: "YYYY-MM-DD"
  environment: "conda:proj006"

steps:
  - step_id: "S0"
    input_files:
      - "docs/data_collection.csv"
      - "mvp/sidecars/*/sample_summary.csv"
    output_files:
      - "results/v6_1/step0/cohort_registry_v6_1.csv"
      - "results/v6_1/step0/treatment_context_flags.csv"
      - "results/v6_1/step0/response_label_dictionary.csv"
      - "results/v6_1/step0/cohort_qc_audit.csv"
    scripts:
      - "scripts/v6_1/s0_registry_lock.py"
    parameters:
      context_a_definition: ["PD1", "PDL1", "clean_ICI"]
      context_b_definition: ["PD1+X"]
      context_c_definition: ["high_confounding_combo"]
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B", "C"]
      centers: "all_after_qc"
      timepoint_policy: "lock_before_modeling"
    notes: "Lock cohorts, labels, and treatment context before any modeling."
    downstream_dependencies: ["S1", "S2", "S3", "S4", "S5", "S6"]

  - step_id: "S1"
    input_files:
      - "results/v6_1/step0/cohort_registry_v6_1.csv"
      - "results/v6_1/step0/treatment_context_flags.csv"
      - "mvp/sidecars/*/obs.parquet"
      - "mvp/sidecars/*/var.parquet"
      - "<raw_count_matrices>"
    output_files:
      - "results/v6_1/step1/sample_index_master_v6_1.csv"
      - "results/v6_1/step1/cell_state_fraction_by_sample.parquet"
      - "results/v6_1/step1/pseudobulk_by_sample.parquet"
      - "results/v6_1/step1/immune_state_features.parquet"
      - "results/v6_1/step1/state_qc_report.csv"
    scripts:
      - "scripts/v6_1/s1_immune_state_measurement.py"
    parameters:
      min_cells_per_sample: "<int>"
      min_genes_per_cell: "<int>"
      batch_correction: "<method>"
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B", "C"]
      centers: "qc_passed"
      timepoint_policy: "predefined"
    notes: "Produce reusable patient-level immune-state tables."
    downstream_dependencies: ["S2", "S3"]

  - step_id: "S2"
    input_files:
      - "results/v6_1/step0/response_label_dictionary.csv"
      - "results/v6_1/step1/cell_state_fraction_by_sample.parquet"
      - "results/v6_1/step1/pseudobulk_by_sample.parquet"
      - "results/v6_1/step1/immune_state_features.parquet"
    output_files:
      - "results/v6_1/step2/strong_baseline_results.csv"
      - "results/v6_1/step2/strong_baseline_cv_predictions.parquet"
      - "results/v6_1/step2/strong_baseline_model_cards.yaml"
      - "results/v6_1/step2/negative_control_audit.csv"
    scripts:
      - "scripts/v6_1/s2_strong_baselines.py"
    parameters:
      models: ["elastic_net", "logistic", "cox", "xgboost", "static_module", "scvi_latent_simple_clf"]
      cv_scheme: "LOCO_or_leave_center_out"
      calibration: true
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B"]
      centers: "qc_passed"
      timepoint_policy: "analysis_defined"
    notes: "Hard gate: no advanced model claims without this step."
    downstream_dependencies: ["S3", "S4", "S6"]

  - step_id: "S3"
    input_files:
      - "results/v6_1/step1/immune_state_features.parquet"
      - "results/v6_1/step1/pseudobulk_by_sample.parquet"
      - "results/v6_1/step2/strong_baseline_results.csv"
      - "<perturb_priors_optional>"
    output_files:
      - "results/v6_1/step3/shared_specific_modules.csv"
      - "results/v6_1/step3/immune_module_scores.csv"
      - "results/v6_1/step3/pd1_anchor_modules.csv"
      - "results/v6_1/step3/module_stability_report.csv"
    scripts:
      - "scripts/v6_1/s3_module_discovery.py"
    parameters:
      module_method: "<method_name>"
      stability_bootstrap: "<int>"
      perturb_prior_mode: "soft_constraint"
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B"]
      centers: "qc_passed"
      timepoint_policy: "locked_from_s0"
    notes: "Anchor-first module discovery."
    downstream_dependencies: ["S4", "S5", "S6"]

  - step_id: "S4"
    input_files:
      - "results/v6_1/step0/treatment_context_flags.csv"
      - "results/v6_1/step3/pd1_anchor_modules.csv"
      - "results/v6_1/step3/immune_module_scores.csv"
      - "results/v6_1/step2/strong_baseline_results.csv"
      - "<perturb_priors>"
    output_files:
      - "results/v6_1/step4/pd1x_repair_hypotheses.csv"
      - "results/v6_1/step4/M_signals_v6_1.csv"
      - "results/v6_1/step4/mechanism_support_precheck.csv"
    scripts:
      - "scripts/v6_1/s4_pd1x_repair_logic.py"
    parameters:
      m_signals: ["mIMS", "MRI", "mICS", "ESR", "LRG-spatial"]
      nomination_mode: "mechanism_class_first"
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B"]
      centers: "qc_passed"
      timepoint_policy: "locked_from_s0"
    notes: "Every nomination must map to a PD-1 anchor barrier."
    downstream_dependencies: ["S5", "S6"]

  - step_id: "S5"
    input_files:
      - "results/v6_1/step3/shared_specific_modules.csv"
      - "results/v6_1/step4/pd1x_repair_hypotheses.csv"
      - "<spatial_or_tissue_data>"
      - "<ligand_receptor_reference>"
    output_files:
      - "results/v6_1/step5/spatial_adjudication_results.csv"
      - "results/v6_1/step5/lrg_spatial_support.csv"
      - "results/v6_1/step5/spatial_failure_flags.csv"
      - "results/v6_1/step5/spatial_adjudication_report.md"
    scripts:
      - "scripts/v6_1/s5_spatial_adjudication.py"
    parameters:
      adjacency_metric: "<metric>"
      exclusion_score_method: "<method>"
      niche_definition: "<method>"
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer_if_available"]
      treatment_contexts: ["A", "B"]
      centers: "spatial_qc_passed"
      timepoint_policy: "aligned_with_s0"
    notes: "Biological adjudication layer; not optional for L2/L3."
    downstream_dependencies: ["S6"]

  - step_id: "S6"
    input_files:
      - "results/v6_1/step2/strong_baseline_results.csv"
      - "results/v6_1/step3/shared_specific_modules.csv"
      - "results/v6_1/step4/pd1x_repair_hypotheses.csv"
      - "results/v6_1/step4/M_signals_v6_1.csv"
      - "results/v6_1/step5/spatial_adjudication_results.csv"
      - "<external_bulk_or_clinical_anchors>"
    output_files:
      - "results/v6_1/step6/PD1X_nomination_cards.csv"
      - "results/v6_1/step6/external_validation_results.csv"
      - "results/v6_1/step6/wetlab_priority_list.csv"
      - "results/v6_1/step6/final_evidence_table.csv"
    scripts:
      - "scripts/v6_1/s6_translational_nomination.py"
    parameters:
      evidence_levels: ["L1", "L2", "L3"]
      top_k_targets: 3
      require_spatial_for_l23: true
      prohibit_lincs_standalone: true
    random_seed: 42
    cohort_scope:
      cancer_types: ["HCC", "pan-cancer"]
      treatment_contexts: ["A", "B"]
      centers: "all_qc_passed"
      timepoint_policy: "locked_from_s0"
    notes: "Final nomination is mechanism-first, not prescription-first."
    downstream_dependencies: []
